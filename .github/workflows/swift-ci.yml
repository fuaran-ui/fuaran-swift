# macOS CI for fuaran-swift — the native Swift surface over the Rust reference core.
#
# Why macOS-only: Windows/Linux dev boxes have the Swift compiler + Foundation but NOT
# SwiftUI (a closed Apple framework), so the SwiftUI renderer floor (Phase 540) and the
# interaction driver (Phase 541) cannot build off an Apple platform. This workflow is the
# Apple environment those phases need — GitHub-hosted macOS runners run on genuine Apple
# hardware (license-compliant), so SwiftUI builds and renders here.
#
# It mirrors run.ps1's happy path (C-ABI header check + swift build + swift test), plus one
# further leg:
#   • swift-core   — checks out the fuaran-rs reference core beside this repository, byte-compares
#                    the C header copy against it, and links the core staticlib so the C-ABI
#                    SessionTests run instead of skipping (Phase 539).
#
# There is no xcframework job. One existed and reported success while assembling nothing
# (see the README's "Consuming a live session"); it was removed rather than left green.
#
# COST NOTE: GitHub-hosted macOS runners bill at ~10x the Linux rate. Path filters keep
# this off unrelated changes.
#
# NO SECRETS REQUIRED: every sibling this workflow checks out (fuaran-ui/fuaran-rs,
# fuaran-ui/fuaran-ui-specification) is public, so all checkouts are tokenless. The
# FUARAN_RS_PAT secret and its presence-gate job are retired (2026-09-01) — fuaran-rs
# is public, so the core leg no longer skips when a secret is absent.

name: swift-ci

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      # The committed residue set IS gate input: editing it changes what the corpus
      # and obligation gates permit, so a change to it must re-run them. Without this
      # entry a residue edit is invisible to CI, which is the same class of defect as
      # a gate that never triggers.
      - "conformance-residue.txt"
      # The pinned corpus revision IS gate input too, and more directly than the
      # residue set: it decides WHICH corpus every gate below reads. A pin moved
      # without re-running them would be a claim nothing checked.
      - "corpus-pin.json"
      - "dev-scripts/**"
      - ".github/workflows/swift-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      # The committed residue set IS gate input: editing it changes what the corpus
      # and obligation gates permit, so a change to it must re-run them. Without this
      # entry a residue edit is invisible to CI, which is the same class of defect as
      # a gate that never triggers.
      - "conformance-residue.txt"
      # The pinned corpus revision IS gate input too, and more directly than the
      # residue set: it decides WHICH corpus every gate below reads. A pin moved
      # without re-running them would be a claim nothing checked.
      - "corpus-pin.json"
      - "dev-scripts/**"
      - ".github/workflows/swift-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Primary: pure-Swift build + test on macOS ──────────────────────────────────
  # Model + render-projection decoder + the SwiftUI renderer floor (Phase 540, once it
  # lands). No Rust core: FUARAN_CORE_AVAILABLE stays undefined and SessionTests skip
  # cleanly — the same clean-skip Package.swift performs on a non-Apple box without the
  # staticlib. This job needs no sibling checkout, so it always runs.
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The corpus became its OWN public repo on 2026-07-27
      # (fuaran-ui/fuaran-ui-specification). It had been a tracked folder inside
      # the maintainers' workspace repository, and this step still sparse-checked-out that path —
      # which since the split matches nothing, so the corpus never arrived and
      # the placement `mv` failed with "No such file or directory". Every run
      # since died there, BEFORE `swift build`, and it went unnoticed because the
      # path filters mean only a Sources/Tests/Package.swift push runs this
      # workflow at all. Checking the corpus out directly needs neither a sparse
      # path nor the PAT — the repo is public.
      # ── The corpus is PINNED (Phase 1703) ──────────────────────────────────
      # `corpus-pin.json` records the one corpus revision this repository's gates
      # certify against. Before it, both jobs checked the corpus out at whatever
      # was current, so any corpus-side phase reddened this repository with no
      # commit of its own — which is not a signal about this code at all, and is
      # the reason a red here stopped meaning anything for days at a time.
      #
      # Full depth: `rev-list --count` needs BOTH ends of the range, and a
      # depth-1 checkout holds neither the pinned commit nor `origin/main`, so
      # the drift report would answer "unknown" on every run.
      - name: Read the pinned corpus revision
        id: pin
        run: |
          # The only 40-character hex run in the file is the commit, so `grep -o`
          # reads it with no capture group, one less thing to get subtly wrong
          # between the GNU and BSD tooling on two different runner images.
          ref=$(grep -o '[0-9a-f]\{40\}' corpus-pin.json | head -1)
          test -n "$ref" || {
            echo "::error::corpus-pin.json records no 40-character authorityCommit — the corpus checkout below has nothing to pin to"
            exit 1
          }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "corpus pinned at $ref"

      - name: Checkout wire-format-fixtures corpus (render-coverage gate)
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          ref: ${{ steps.pin.outputs.ref }}
          fetch-depth: 0
          path: _corpus
      - name: Place corpus where the tests look (<repo>/../wire-format-fixtures)
        run: mv _corpus "$GITHUB_WORKSPACE/../wire-format-fixtures"

      # ASSERT the checkout is at the pin, then REPORT how far the pin is behind
      # the corpus's real head. Two different claims, and both are needed: without
      # the assert, dropping the `ref:` above would silently return this job to
      # certifying against whatever is current and every gate would stay green;
      # without the report, the pin would make drift invisible instead of
      # deliberate, which is a worse trade than the red it replaced.
      #
      # Drift is a NOTICE, not a failure. Being behind is the ordinary resting
      # state between a fixture being authored and the decoder work that adopts
      # it; moving the pin adopts that vocabulary and belongs in the same
      # change-set as the adoption.
      - name: Corpus pin — assert the checkout, report the drift
        run: |
          set +e
          pwsh -NoProfile -File dev-scripts/corpus-pin.ps1 -Authority "$GITHUB_WORKSPACE/../wire-format-fixtures" -Assert
          rc=$?
          set -e
          case "$rc" in
            0) echo "corpus pin current." ;;
            2) echo "::notice::the corpus has moved past this repository's pin (see the distance above). Adopting it is a deliberate change-set." ;;
            3) echo "::error::the corpus checkout is not at the pin — the gates below would certify against a revision this repository has not adopted"; exit 1 ;;
            *) echo "::warning::the corpus pin could not be measured (exit $rc)" ;;
          esac

      - name: Select Xcode (Swift 6 toolchain — swift-tools 6.0 requires Xcode 16+)
        run: |
          latest=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: swift build
        run: swift build -v

      - name: swift test
        run: swift test -v
        # The Phase 540 render-coverage checklist (every corpus node fixture renders
        # through the floor with zero fallback-arm hits; per-kind coverage reported)
        # runs here once it ships. SwiftUI snapshot tests render headlessly via
        # ImageRenderer (macOS 13+). For an iOS-simulator render destination, see the
        # optional xcodebuild leg documented below.

      # The go-red proof for the residue comparison. `conformance-residue.txt` names
      # what these gates permit; the gates are red for a CHANGE to that set in either
      # direction, so both directions are exercised against perturbed SCRATCH copies —
      # the committed file is never edited, and the verdict of the real run above
      # stands.
      #
      # Without this the residue mechanism could be silently inert and the job would
      # stay green: exactly the class this change is hardening against.
      - name: Residue gate go-red proof (both directions)
        run: |
          set -uo pipefail
          scratch="$RUNNER_TEMP/residue"
          mkdir -p "$scratch"

          # 1. WITHHELD: strip every entry. An owed obligation the residue does not
          #    name must read as a regression.
          grep -v '^\[obligation\]' conformance-residue.txt > "$scratch/withheld.txt"
          if FUARAN_RESIDUE="$scratch/withheld.txt" swift test --filter RenderObligationTests; then
            echo "::error::an emptied residue set did NOT red the obligation gate — the comparison is inert"
            exit 1
          fi
          echo "go-red 1 OK: an unnamed owed obligation reds the gate."

          # 2. STALE: an entry nothing owes must read as a stale cap.
          cp conformance-residue.txt "$scratch/stale.txt"
          echo '[obligation] ZZNoSuchKind/no-such-claim' >> "$scratch/stale.txt"
          if FUARAN_RESIDUE="$scratch/stale.txt" swift test --filter RenderObligationTests; then
            echo "::error::a residue entry that cannot be owed did NOT read as stale"
            exit 1
          fi
          echo "go-red 2 OK: a stale residue entry reds the gate."

          # 3. ABSENT: a residue file that is not there must FAIL, not read as empty.
          #    A gate that cannot say what it excludes must not report success.
          if FUARAN_RESIDUE="$scratch/definitely-not-a-file" swift test --filter RenderObligationTests; then
            echo "::error::a missing residue file did NOT fail — an absent list is reading as an empty one"
            exit 1
          fi
          echo "go-red 3 OK: an unreadable residue set fails rather than defaulting to empty."

  # ── Optional iOS-simulator render leg (documentation) ──────────────────────────
  # `swift test` above exercises SwiftUI on the macOS host, which covers macOS-target
  # views. If the Phase 540 floor also asserts iOS-specific rendering, add a scheme +
  # xcodebuild destination (SPM packages expose an implicit scheme named after the
  # package):
  #
  #   xcodebuild test \
  #     -scheme fuaran-swift \
  #     -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
  #
  # Left out of the active matrix to keep the default run to one macOS job.

  # ── C-ABI session leg (Phase 539) ──────────────────────────────────────────────
  # Build the fuaran-rs reference-core staticlib and point Package.swift at it, so the
  # FuaranCore target links and SessionTests run instead of skipping.
  swift-core:
    runs-on: macos-15
    steps:
      - name: Checkout fuaran-swift
        uses: actions/checkout@v4
        with:
          path: fuaran-swift

      - name: Checkout fuaran-rs (sibling reference core)
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-rs
          path: fuaran-rs

      # Same 2026-07-27 corpus-repo split as the `swift` job above.
      # ── The corpus is PINNED (Phase 1703) ──────────────────────────────────
      # `corpus-pin.json` records the one corpus revision this repository's gates
      # certify against. Before it, both jobs checked the corpus out at whatever
      # was current, so any corpus-side phase reddened this repository with no
      # commit of its own — which is not a signal about this code at all, and is
      # the reason a red here stopped meaning anything for days at a time.
      #
      # Full depth: `rev-list --count` needs BOTH ends of the range, and a
      # depth-1 checkout holds neither the pinned commit nor `origin/main`, so
      # the drift report would answer "unknown" on every run.
      - name: Read the pinned corpus revision
        id: pin
        run: |
          # The only 40-character hex run in the file is the commit, so `grep -o`
          # reads it with no capture group, one less thing to get subtly wrong
          # between the GNU and BSD tooling on two different runner images.
          ref=$(grep -o '[0-9a-f]\{40\}' fuaran-swift/corpus-pin.json | head -1)
          test -n "$ref" || {
            echo "::error::fuaran-swift/corpus-pin.json records no 40-character authorityCommit — the corpus checkout below has nothing to pin to"
            exit 1
          }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "corpus pinned at $ref"

      - name: Checkout wire-format-fixtures corpus (render-coverage gate)
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          ref: ${{ steps.pin.outputs.ref }}
          fetch-depth: 0
          path: _corpus
      - name: Place corpus as the fuaran-swift sibling (<repo>/../wire-format-fixtures)
        run: mv _corpus "$GITHUB_WORKSPACE/wire-format-fixtures"

      # See the same step in the `swift` job for why the assert and the report are
      # two claims rather than one.
      - name: Corpus pin — assert the checkout, report the drift
        working-directory: fuaran-swift
        run: |
          set +e
          pwsh -NoProfile -File dev-scripts/corpus-pin.ps1 -Authority "$GITHUB_WORKSPACE/wire-format-fixtures" -Assert
          rc=$?
          set -e
          case "$rc" in
            0) echo "corpus pin current." ;;
            2) echo "::notice::the corpus has moved past this repository's pin (see the distance above). Adopting it is a deliberate change-set." ;;
            3) echo "::error::the corpus checkout is not at the pin — the gates below would certify against a revision this repository has not adopted"; exit 1 ;;
            *) echo "::warning::the corpus pin could not be measured (exit $rc)" ;;
          esac

      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version

      - name: Cache cargo + Rust target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuaran-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('fuaran-rs/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The C-ABI header this repository ships is a COPY of the one the reference core
      # ships. This is the only job that has BOTH checked out, so it is the only place
      # the copy can be compared — and until it was, the copy sat 56 lines behind the
      # reference, missing an entire family of session verbs, with every gate green.
      #
      # Before the build, so a header change is reported as a header change rather than
      # as whatever the compiler says about it three steps later.
      - name: C-ABI header (fuaran.h) is byte-identical to the reference
        run: |
          if ! cmp -s fuaran-swift/Sources/FuaranCore/include/fuaran.h fuaran-rs/include/fuaran.h; then
            echo "::error::fuaran.h has drifted from the reference core's header."
            echo "The copy is GENERATED. Regenerate it and read the diff:"
            echo "  cp fuaran-rs/include/fuaran.h fuaran-swift/Sources/FuaranCore/include/fuaran.h"
            diff -u fuaran-swift/Sources/FuaranCore/include/fuaran.h fuaran-rs/include/fuaran.h || true
            exit 1
          fi
          echo "fuaran.h byte-identical to the reference."

      - name: Build the Rust reference-core staticlib (host target)
        working-directory: fuaran-rs
        run: cargo build # → target/debug/libfuaran_rs.a (rustup is preinstalled on macOS runners)

      - name: swift build + test with the C-ABI session leg
        working-directory: fuaran-swift
        env:
          # Package.swift adds the FuaranCore target + FUARAN_CORE_AVAILABLE when it finds
          # the staticlib at this path.
          FUARAN_RS_STATICLIB_DIR: ${{ github.workspace }}/fuaran-rs/target/debug
        run: |
          swift build -v
          swift test -v

  # ── There is no xcframework job, and that is the fix rather than an omission ─────
  #
  # A `workflow_dispatch` job called `xcframework` used to sit here running
  # `pwsh ./run.ps1 -Package`. That switch assembled nothing — it printed a note
  # saying the implementation was elsewhere — so the job reported success, uploaded
  # no artefact, and was the evidence everything downstream cited for believing a
  # FuaranCore.xcframework exists. A green job that produces nothing is worse than
  # no job: it is a passing check for an absent capability.
  #
  # When the packaging is actually written, the job comes back with the property it
  # never had: it FAILS unless an artefact is produced, and uploads it.
